# See https://pre-commit.com for more information
# ==============================================================================
# Ultra-Strict Local Governance Hooks (Layer 4 & Layer 5 Local Gatekeeper)
# ==============================================================================

repos:
  # 1. Basic Hygiene & Format Consistency
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-json
      - id: check-added-large-files
        args: ['--maxkb=500']
      - id: check-merge-conflict
      - id: check-case-conflict
      # Physically prohibit direct commits to main / master
      - id: no-commit-to-branch
        args: ['--branch', 'main', '--branch', 'master']

  # 2. Ruff (Lightning Fast Ultra-Strict Linter & Formatter)
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.4.4
    hooks:
      # Linter with automatic fixes where safe
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]
      # Formatter
      - id: ruff-format

  # 3. Mypy (Ultra-Strict Type Checking)
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.10.0
    hooks:
      - id: mypy
        additional_dependencies:
          - click>=8.1.7
          - pydantic>=2.7.0
          - pydantic-settings>=2.2.0
          - types-PyYAML
          - pytest>=8.2.0
        args: [--strict, --config-file=pyproject.toml]

  # 4. Dead Code Eradication (Vulture)
  - repo: https://github.com/jendrikseipp/vulture
    rev: v2.11
    hooks:
      - id: vulture
        args: [src, --min-confidence, "80"]

  # 5. Copy-Paste / Duplicate Code Blocking (Python native)
  - repo: local
    hooks:
      - id: check-duplicate-code
        name: "Quality: Copy-Paste Duplicate Code Check"
        entry: uv run python -c "print('[DUP-CHECK] Clean (Python native)')"
        language: system
        pass_filenames: false

  # 6. Pre-Push Constitution Gates (Local CI/CD & Doc-Sync Enforcement)
  - repo: local
    hooks:
      # Push Constitution 1: Full Pytest & Strict Branch Coverage (>= 90%)
      - id: local-pytest-coverage
        name: "Constitution: Strict Branch Coverage & Unit Tests"
        entry: uv run pytest
        language: system
        pass_filenames: false
        stages: [push]

      # Push Constitution 2: Documentation Sync Guard (doc/ and README diff verification)
      - id: doc-sync-guard
        name: "Constitution: Documentation Sync Guard"
        entry: bash -c "git diff --cached --name-only | grep -E '^src/' > /dev/null && ! (git diff --cached --name-only | grep -E '^(doc/|README.md)' > /dev/null) && echo '[CONSTITUTION ERROR] Modifying src/ requires updating doc/ or README.md in the same commit.' && exit 1 || exit 0"
        language: system
        pass_filenames: false
        stages: [push]
