# Hygiene only. Quality checks live in scripts/gate.sh (DEC-031).
# skills/yomiyasu is vendored upstream code; keep its bytes as published (DEC-068).
exclude: ^skills/yomiyasu/
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-json
      - id: check-added-large-files
        args: ['--maxkb=500']
      - id: check-merge-conflict
      - id: check-case-conflict
