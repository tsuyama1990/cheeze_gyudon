# See https://pre-commit.com for more information
# ==============================================================================
# Local hooks (commit and push stages)
# ==============================================================================

repos:
  # 1. Basic Hygiene & Format Consistency
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-json
      - id: check-added-large-files
        args: ['--maxkb=500']
      - id: check-merge-conflict
      - id: check-case-conflict
      # Reject direct commits to main / master
      - id: no-commit-to-branch
        args: ['--branch', 'main', '--branch', 'master']

  # 2. Ruff (project-pinned version via uv, so hook and CI agree)
  - repo: local
    hooks:
      - id: ruff
        name: "ruff (lint)"
        entry: uv run ruff check --fix
        language: system
        types: [python]
      - id: ruff-format
        name: "ruff (format)"
        entry: uv run ruff format
        language: system
        types: [python]

  # 3. Mypy (strict, via the local uv environment)
  - repo: local
    hooks:
      - id: mypy
        name: "mypy (strict)"
        entry: uv run mypy src tests
        language: system
        pass_filenames: false

  # 4. Dead code (Vulture)
  - repo: https://github.com/jendrikseipp/vulture
    rev: v2.11
    hooks:
      - id: vulture
        args: [src, --min-confidence, "80"]

  # 5. Copy-Paste / Duplicate Code Blocking (Python native real check)
  - repo: local
    hooks:
      - id: check-duplicate-code
        name: "Quality: Copy-Paste Duplicate Code Check"
        entry: uv run python scripts/check_duplicates.py
        language: system
        pass_filenames: false

  # 6. Local Quality & Constitution Gates (Commit & Push Stages)
  - repo: local
    hooks:
      # Constitution 1: Documentation Sync Guard (staged diff verification at commit time)
      - id: doc-sync-guard
        name: "Constitution: Documentation Sync Guard"
        entry: uv run python scripts/doc_sync_guard.py
        language: system
        pass_filenames: false
        always_run: true
        stages: [commit]

      # Constitution 2: Full Pytest & Branch Coverage (threshold: pyproject.toml)
      - id: local-pytest-coverage
        name: "Constitution: Strict Branch Coverage & Unit Tests"
        entry: uv run pytest
        language: system
        pass_filenames: false
        stages: [commit, push]
