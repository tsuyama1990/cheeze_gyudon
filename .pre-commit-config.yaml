# See https://pre-commit.com for more information
# ==============================================================================
# Ultra-Strict Local Governance Hooks (Layer 4 & Layer 5 Local Gatekeeper)
# ==============================================================================

repos:
  # 1. Basic Hygiene & Format Consistency
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-json
      - id: check-added-large-files
        args: ['--maxkb=500']
      - id: check-merge-conflict
      - id: check-case-conflict
      # Physically prohibit direct commits to main / master
      - id: no-commit-to-branch
        args: ['--branch', 'main', '--branch', 'master']

  # 2. Ruff (Lightning Fast Ultra-Strict Linter & Formatter)
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.4.4
    hooks:
      # Linter with automatic fixes where safe
      - id: ruff
        args: [--fix]
      # Formatter
      - id: ruff-format

  # 3. Mypy (Ultra-Strict Type Checking via local uv environment)
  - repo: local
    hooks:
      - id: mypy
        name: "mypy (strict)"
        entry: uv run mypy src tests
        language: system
        pass_filenames: false

  # 4. Dead Code Eradication (Vulture)
  - repo: https://github.com/jendrikseipp/vulture
    rev: v2.11
    hooks:
      - id: vulture
        args: [src, --min-confidence, "80"]

  # 5. Copy-Paste / Duplicate Code Blocking (Python native real check)
  - repo: local
    hooks:
      - id: check-duplicate-code
        name: "Quality: Copy-Paste Duplicate Code Check"
        entry: uv run python scripts/check_duplicates.py
        language: system
        pass_filenames: false

  # 6. Local Quality & Constitution Gates (Commit & Push Stages)
  - repo: local
    hooks:
      # Constitution 1: Documentation Sync Guard (staged diff verification at commit time)
      - id: doc-sync-guard
        name: "Constitution: Documentation Sync Guard"
        entry: uv run python scripts/doc_sync_guard.py
        language: system
        pass_filenames: false
        always_run: true
        stages: [commit]

      # Constitution 2: Full Pytest & Strict Branch Coverage (>= 90%)
      - id: local-pytest-coverage
        name: "Constitution: Strict Branch Coverage & Unit Tests"
        entry: uv run pytest
        language: system
        pass_filenames: false
        stages: [commit, push]
